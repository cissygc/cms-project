spring.application.name=revlo-cms-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/cms
spring.jpa.properties.hibernate.default_schema=cms
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 

# Multipart yükleme limitleri - önceden hiç tan?ml? de?ildi, Spring'in
# varsay?lan? (1MB/dosya) sessizce devredeydi. MediaServiceImpl'deki 10MB'l?k
# kontrolle tutarl? olsun diye burada da 10MB'a çekiyoruz; aksi halde dosya
# servis katman?na ula?madan Spring taraf?ndan 1MB'ta reddedilirdi.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB