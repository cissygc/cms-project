backend:
  name: my-custom-backend

media_folder: "uploads"
public_folder: "http://localhost:8080/uploads"


collections:
  - name: "posts"
    label: "Yazılar"
    folder: "posts"
    create: true
    slug: "{{title}}"
    extension: json
    format: json
    summary: "{{title}}"
    identifier_field: "title"
    sortable_fields:
      - "date"
      - "title"

    fields:
      - label: "Başlık"
        name: "title"
        widget: "string"
        required: false

      - label: "Tarih"
        name: "date"
        widget: "datetime"
        required: false

      - label: "Kapak Fotoğrafı"
        name: "image"
        widget: "customImage"
        required: false

      - label: "İçerik"
        name: "body"
        widget: "markdown"
        required: false