backend:
  name: my-custom-backend

media_folder: "uploads"
# ÖNEMLİ: public_folder artık MUTLAK URL - backend'in adresi.
# ngrok adresin değişirse SADECE burayı (ve custom-backend.js'teki BASE_URL'i) güncelle.
public_folder: "https://provoking-dork-purchase.ngrok-free.dev/uploads"

collections:
  - name: "posts"
    label: "Yazılar"
    folder: "posts"
    create: true
    extension: json
    format: json
    sortable_fields: ["date", "title", "author"]
    fields:
      - { label: "Başlık", name: "title", widget: "string", required: true }
      - { label: "Tarih", name: "date", widget: "datetime", default: "", required: false }
      - { label: "Kapak Fotoğrafı", name: "image", widget: "image", required: false }
      - { label: "İçerik", name: "body", widget: "markdown", required: true }
      - { label: "Yazar", name: "author", widget: "string", required: true }